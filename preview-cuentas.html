<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview - Cuentas Bancarias</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0908;
    --card: #16130f;
    --card-border: #2b2419;
    --gold: #d4af37;
    --gold-light: #f0d078;
    --gold-dim: #8a6d1f;
    --text: #f5f0e6;
    --text-dim: #9b9284;
  }
  body { background-color: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); }
  .font-display { font-family: 'Cormorant Garamond', serif; }
  .card-cuenta {
    background: linear-gradient(160deg, #1a1611 0%, #100d0a 100%);
    border: 1px solid var(--card-border);
    transition: transform .25s ease, border-color .25s ease;
  }
  .card-cuenta:hover { transform: translateY(-4px); border-color: var(--gold-dim); }
  .icon-circle {
    background: radial-gradient(circle at 35% 30%, #2a2418, #0d0b08);
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 1px rgba(212,175,55,0.15), inset 0 0 10px rgba(0,0,0,0.6);
  }
  .icon-square {
    background: radial-gradient(circle at 35% 30%, #2a2418, #0d0b08);
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 1px rgba(212,175,55,0.15), inset 0 0 10px rgba(0,0,0,0.6);
  }
  .divider-gold { background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); height: 1px; }
  .glow-text { text-shadow: 0 0 20px rgba(212,175,55,0.25); }
</style>
</head>
<body class="min-h-screen p-6 md:p-10">

    <div class="max-w-md card-cuenta rounded-3xl p-6 overflow-hidden">

     <!-- Encabezado + Saldo total (con línea de fondo) -->
    <div class="relative mb-8">

      <img src="https://cdn.jsdelivr.net/gh/willfontalvo/dashboard-financiero@main/assets/icons/linea-grafico.png"
           class="absolute object-contain z-0 pointer-events-none"
           style="opacity: 0.6; top: 0px; bottom: -10px; right: -24px; width: 100%; object-position: right bottom;"
           alt="Tendencia">

      <div class="relative z-10">
        <div class="flex items-center justify-between mb-6">
          <div class="flex items-center gap-3">
            <img src="https://cdn.jsdelivr.net/gh/willfontalvo/dashboard-financiero@main/assets/icons/banco.png" class="w-12 h-12 object-contain" alt="Banco">
            <h1 class="font-display text-2xl font-semibold text-white">Cuentas bancarias</h1>
          </div>
          <img src="https://cdn.jsdelivr.net/gh/willfontalvo/dashboard-financiero@main/assets/icons/crecimiento.png" class="w-16 h-16 object-contain shrink-0" alt="Tendencia">
        </div>

        <p class="uppercase tracking-widest text-xs mb-1" style="color: var(--gold);">Saldo total</p>
        <p id="saldoTotal" class="font-display text-5xl font-bold glow-text" style="color: var(--gold-light);">$ 0</p>
      </div>

    </div>

    <div class="divider-gold my-6"></div>
    <!-- Grid de cuentas: 2 columnas -->
    <div id="gridCuentas" class="grid grid-cols-2 gap-4"></div>

  </div>

<script>
  const cuentas = [
    { nombre: "Efectivo",      icono: "efectivo.png",    conCirculo: true,  saldo: 350000 },
    { nombre: "Bancolombia W", icono: "bancolombia.png", conCirculo: false, saldo: 1890000 },
    { nombre: "Bancolombia N", icono: "bancolombia.png", conCirculo: false, saldo: 745000 },
    { nombre: "Nequi W",       icono: "nequi.png",       conCirculo: false, saldo: 245000 },
    { nombre: "Nequi N",       icono: "nequi.png",       conCirculo: false, saldo: 428000 },
    { nombre: "Daviplata N",   icono: "banco.png",       conCirculo: false, saldo: 112000 },
    { nombre: "Falabella",     icono: "falabella.png",   conCirculo: false, saldo: 980000 },
  ];

  const formatoPesos = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
  const grid = document.getElementById('gridCuentas');
  let total = 0;

  cuentas.forEach(c => {
    total += c.saldo;
    const icono = c.conCirculo
      ? `<div class="icon-circle w-11 h-11 rounded-full flex items-center justify-center p-2">
           <img src="https://cdn.jsdelivr.net/gh/willfontalvo/dashboard-financiero@main/assets/icons/${c.icono}" class="w-full h-full object-contain" alt="${c.nombre}">
         </div>`
      : `<img src="https://cdn.jsdelivr.net/gh/willfontalvo/dashboard-financiero@main/assets/icons/${c.icono}" class="w-11 h-11 object-contain" alt="${c.nombre}">`;

    grid.innerHTML += `
      <div class="card-cuenta rounded-2xl p-4 flex flex-col">
        <div class="flex items-start justify-between mb-3">
          ${icono}
          <button class="text-lg" style="color: var(--text-dim);">&#8942;</button>
        </div>
        <p class="font-semibold text-white text-sm">${c.nombre}</p>
        <div class="divider-gold my-2"></div>
        <p class="font-display text-xl font-bold" style="color: var(--gold-light);">${formatoPesos.format(c.saldo)}</p>
      </div>`;
  });

  document.getElementById('saldoTotal').textContent = formatoPesos.format(total);
</script>

</body>
</html>
