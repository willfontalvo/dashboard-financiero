<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview - Cuentas Bancarias</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0908;
    --card: #16130f;
    --card-border: #2b2419;
    --gold: #d4af37;
    --gold-light: #f0d078;
    --gold-dim: #8a6d1f;
    --text: #f5f0e6;
    --text-dim: #9b9284;
  }
  body { background-color: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); }
  .font-display { font-family: 'Cormorant Garamond', serif; }
  .card-cuenta {
    background: linear-gradient(160deg, #1a1611 0%, #100d0a 100%);
    border: 1px solid var(--card-border);
    transition: transform .25s ease, border-color .25s ease;
  }
  .card-cuenta:hover { transform: translateY(-4px); border-color: var(--gold-dim); }
  .icon-circle {
    background: radial-gradient(circle at 35% 30%, #2a2418, #0d0b08);
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 1px rgba(212,175,55,0.15), inset 0 0 10px rgba(0,0,0,0.6);
  }
  .icon-square {
    background: radial-gradient(circle at 35% 30%, #2a2418, #0d0b08);
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 1px rgba(212,175,55,0.15), inset 0 0 10px rgba(0,0,0,0.6);
  }
  .divider-gold { background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); height: 1px; }
  .glow-text { text-shadow: 0 0 20px rgba(212,175,55,0.25); }
</style>
</head>
<body class="min-h-screen p-6 md:p-10">

  <div class="max-w-6xl mx-auto card-cuenta rounded-3xl p-6 md:p-10">

      <!-- Encabezado -->
    <div class="relative flex items-center justify-between mb-8 h-16">
      <!-- Línea de gráfico decorativa -->
        <svg class="absolute left-0 w-full z-0" viewBox="0 0 1000 220" preserveAspectRatio="none" style="overflow: visible; top: 10px; height: 220px;">
             <path d="M0,150 Q250,170 500,110 T1000,8"
              fill="none" stroke="url(#gradLinea)" stroke-width="1.5" opacity="0.55"/>
             <circle cx="1000" cy="8" r="4" fill="var(--gold-light)"/>
        <defs>
          <linearGradient id="gradLinea" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="var(--gold-dim)"/>
            <stop offset="100%" stop-color="var(--gold-light)"/>
            </linearGradient>
        </defs>
      </svg>

      <div class="relative z-10 flex items-center gap-4">
        <div class="icon-square w-14 h-14 rounded-2xl flex items-center justify-center p-2.5" style="background-color: var(--bg);">
          <img src="https://cdn.jsdelivr.net/gh/willfontalvo/dashboard-financiero@main/assets/icons/banco.png" class="w-full h-full object-contain" alt="Banco">
        </div>
        <h1 class="font-display text-3xl md:text-4xl font-semibold text-white" style="background-color: var(--bg);">Cuentas bancarias</h1>
      </div>
      <div class="icon-circle relative z-10 w-16 h-16 rounded-full flex items-center justify-center p-3 shrink-0">
        <img src="https://cdn.jsdelivr.net/gh/willfontalvo/dashboard-financiero@main/assets/icons/crecimiento.png" class="w-full h-full object-contain" alt="Tendencia">
      </div>
    </div>

    <!-- Saldo total -->
    <p class="uppercase tracking-widest text-sm mb-1" style="color: var(--gold);">Saldo total</p>
    <p id="saldoTotal" class="font-display text-6xl md:text-7xl font-bold glow-text" style="color: var(--gold-light);">$ 0</p>

    <div class="divider-gold my-8"></div>

    <!-- Grid de cuentas -->
    <div id="gridCuentas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5"></div>

  </div>
